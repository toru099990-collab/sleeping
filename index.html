<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>体調ログ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="睡眠ログ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2a4a">
<style>
:root{--bg:#f3f1ec;--sf:#fff;--ink:#222a33;--sub:#667080;--ln:#dcd8cf;--ac:#2f5d9e;--pos:#1f7a4d;--neg:#b3402f;--ac-t:#fff;
--l5:rgba(31,122,77,.24);--l4:rgba(31,122,77,.11);--l3:rgba(120,125,135,.14);--l2:rgba(179,64,47,.13);--l1:rgba(179,64,47,.27);
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--grid:#e1e0d9;--axis:#c3c2b7;--mut:#898781}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--sf:#1b222b;--ink:#e6ebf2;--sub:#98a3b3;--ln:#2d3744;--ac:#7fa9e6;--pos:#5fcf95;--neg:#f08a78;--ac-t:#10161d;color-scheme:dark;
--l5:rgba(95,207,149,.30);--l4:rgba(95,207,149,.14);--l3:rgba(150,160,175,.16);--l2:rgba(240,138,120,.16);--l1:rgba(240,138,120,.32);
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--grid:#2c2c2a;--axis:#383835}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.5 -apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:0 0 2px}
.st{font-size:12px;color:var(--sub);margin-bottom:12px}
nav{display:flex;gap:3px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:14px}
nav button{flex:1 1 auto;font:inherit;font-size:13px;border:0;background:none;color:var(--sub);padding:8px 2px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--ac-t);font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:9px 10px;width:100%}
textarea{min-height:96px;font-size:15px;resize:vertical}
input[readonly]{opacity:.7}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;padding:9px 4px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
#modeseg button{font-size:14px;padding:10px 2px}
.btn{font:inherit;width:100%;margin-top:14px;padding:12px;border:0;border-radius:11px;background:var(--ac);color:var(--ac-t);font-weight:600;cursor:pointer}
.btn.alt{background:none;color:var(--ac);border:1px solid var(--ac)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg)}
.btn.danger.arm{background:var(--neg);color:var(--bg)}
.sm:disabled{opacity:.35;cursor:default}
.sm{font:inherit;font-size:13px;border:1px solid var(--ln);background:none;color:var(--sub);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
.chip.off{opacity:.5}
.chip[data-gs][aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--ink)}
.srow{padding:10px 0;border-bottom:1px solid var(--ln)}
.srow:last-of-type{border-bottom:0}
input[type=range]{padding:0;accent-color:var(--ac);margin-top:6px}
input[type=range].unset{opacity:.4}
.total{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:6px}
.total span{font-size:20px;font-weight:700}
.bar{position:relative;height:10px;background:var(--bg);border-radius:5px;margin:6px 0}
.bar:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--sub)}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.small{font-size:12.5px;color:var(--sub)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
h3{margin:0 0 2px;font-size:16px}
.rk{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.rk:first-of-type{border-top:0}
.rk .n{width:24px;height:24px;border-radius:50%;background:var(--bg);font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.pt{font-weight:700;font-size:18px;white-space:nowrap}
.rel{font-size:11px;font-weight:400;padding:1px 6px;border-radius:5px;background:var(--bg);color:var(--sub);margin-left:4px}
.band{display:grid;grid-template-columns:128px 1fr 44px;gap:6px;align-items:center;font-size:12.5px;margin:4px 0}
.band .b{height:14px;border-radius:3px;background:var(--ac);opacity:.45}.band.best .b{background:var(--pos);opacity:1}.band.bad .b{background:var(--neg);opacity:1}
.kwv{font-weight:600}
.note{margin-top:6px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
p{margin:0 0 8px}
/* calendar */
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhd b{font-size:17px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{margin-bottom:4px;text-align:center;font-size:12px;color:var(--sub)}
.dow .sun{color:var(--neg)}.dow .sat{color:var(--ac)}
.day{font:inherit;position:relative;min-height:62px;padding:3px 2px 4px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.day .dn{align-self:flex-start;margin-left:3px;font-size:11px;color:var(--sub);line-height:1}
.day .fc{font-size:22px;line-height:1}
.day .ds{font-size:11px;font-weight:600;line-height:1;min-height:11px}
.day.l5{background:var(--l5)}.day.l4{background:var(--l4)}.day.l3{background:var(--l3)}.day.l2{background:var(--l2)}.day.l1{background:var(--l1)}
.day.today{border:2px solid var(--ac)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--sub);margin-top:10px}
/* graph */
.gsvg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.gsvg text{fill:var(--mut);font-size:10px;font-family:inherit}
.gsvg .gl{stroke:var(--grid);stroke-width:1}
.gsvg .ax{stroke:var(--axis);stroke-width:1}
.gsvg .cx{stroke:var(--sub);stroke-width:1}
.gsvg .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gsvg .mk{stroke:var(--sf);stroke-width:2}
.gsvg text.lt{fill:#fff;font-size:10.5px;font-weight:700;stroke:none}.gsvg text.lt.dk{fill:#1a1a19}
.dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;font-style:normal;color:#fff;vertical-align:middle;margin-right:4px}
.dot.c1{background:var(--s1)}.dot.c2{background:var(--s2)}.dot.c3{background:var(--s3)}.dot.c4{background:var(--s4);color:#1a1a19}
.c1{stroke:var(--s1);fill:var(--s1)}.c2{stroke:var(--s2);fill:var(--s2)}.c3{stroke:var(--s3);fill:var(--s3)}.c4{stroke:var(--s4);fill:var(--s4)}
.gsvg .ln.c1,.gsvg .ln.c2,.gsvg .ln.c3,.gsvg .ln.c4{fill:none}
.gsvg .mk.c1,.gsvg .mk.c2,.gsvg .mk.c3,.gsvg .mk.c4{stroke:var(--sf)}
.key{display:inline-block;vertical-align:middle}
.key.c1{background:var(--s1)}.key.c2{background:var(--s2)}.key.c3{background:var(--s3)}.key.c4{background:var(--s4)}
.key{width:16px;height:3px;border-radius:2px}
.rd{margin-top:8px;font-size:13.5px}
.rd .vals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.rd .vals span{white-space:nowrap}
.rd .vals b{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:500}
summary{cursor:pointer;color:var(--ac);font-size:14px;margin-top:10px}
details label.ck{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14px;color:var(--ink)}
details label.ck input{width:auto}
.sumtxt p{font-size:14.5px}
</style>
</head>
<body>
<main>
  <h1>体調ログ</h1>
  <div class="st" id="st"></div>
  <nav id="nav"></nav>
  <div id="view"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const KEY="sleep-v1",MODEKEY="sleep-mode";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEASONS=["早春","春","初夏","梅雨","真夏","初秋","秋","晩秋","冬","真冬"];
// 月 → 季節（境目を変えたいときは、この表を直してください）
const SEASON_BY_MONTH=[null,"真冬","真冬","早春","春","初夏","梅雨","真夏","真夏","初秋","秋","晩秋","冬"];
const seasonOf=d=>SEASON_BY_MONTH[+d.slice(5,7)]||"";
const SEASON=()=>({id:"season",name:"季節",type:"choice",opts:SEASONS.slice(),auto:"season"});
const DEF=()=>[
 {id:"steps",name:"歩数",type:"num",unit:"歩"},
 {id:"tempOut",name:"外気温",type:"num",unit:"℃"},
 {id:"tempIn",name:"室温",type:"num",unit:"℃"},
 {id:"rhIn",name:"室内湿度",type:"num",unit:"%"},
 {id:"ah",name:"絶対湿度",type:"num",unit:"g/m³",computed:true},
 SEASON(),
 {id:"holiday",name:"休日",type:"bool"},
 {id:"alcohol",name:"飲酒",type:"bool"},
 {id:"onanie",name:"オナニー",type:"bool"}];
const LEVELS=[
 {min:80,c:"l5",e:"😄",t:"80点以上"},
 {min:60,c:"l4",e:"🙂",t:"60〜79点"},
 {min:40,c:"l3",e:"😐",t:"40〜59点"},
 {min:20,c:"l2",e:"😞",t:"20〜39点"},
 {min:0,c:"l1",e:"😫",t:"0〜19点"}];
const level=s=>LEVELS.find(l=>s>=l.min)||LEVELS[LEVELS.length-1];
const SLOTS=[{k:"am",n:"朝"},{k:"noon",n:"昼"},{k:"pm",n:"夕"}];
const TARGETS=[{k:"total",n:"総合"}].concat(SLOTS);
const SERIES=[{k:"total",n:"総合",t:"総",c:"c1"},{k:"am",n:"朝",t:"朝",c:"c2"},{k:"noon",n:"昼",t:"昼",c:"c3"},{k:"pm",n:"夕",t:"夕",c:"c4"}];
const sLabel=s=>s.n;
const WD=["日","月","火","水","木","金","土"];

/* ---------- 日付の道具 ---------- */
const dn=d=>{const p=d.split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2])/86400000};
const fromDn=n=>{const t=new Date(n*86400000);return t.getUTCFullYear()+"-"+String(t.getUTCMonth()+1).padStart(2,"0")+"-"+String(t.getUTCDate()).padStart(2,"0")};
const addDays=(d,n)=>fromDn(dn(d)+n);
const md=d=>(+d.slice(5,7))+"/"+(+d.slice(8,10));
const wd=d=>WD[new Date(dn(d)*86400000).getUTCDay()];
const fmtDay=d=>`${+d.slice(5,7)}月${+d.slice(8,10)}日（${wd(d)}）`;
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
// 日本の祝日（振替休日・国民の休日を含む）。年末年始などの会社独自の休みは入っていないので、必要な日は後から変えてください
const HOL_CACHE={};
function holidaysOf(y){
  if(HOL_CACHE[y])return HOL_CACHE[y];
  const m={},pad=n=>String(n).padStart(2,"0"),key=(mo,d)=>`${y}-${pad(mo)}-${pad(d)}`;
  const wk=ds=>new Date(dn(ds)*86400000).getUTCDay();
  const fx=(mo,d,n)=>{m[key(mo,d)]=n};
  const nthMon=(mo,n)=>{const f=new Date(Date.UTC(y,mo-1,1)).getUTCDay();return 1+((8-f)%7)+(n-1)*7};
  const eq=(base)=>Math.floor(base+0.242194*(y-1980)-Math.floor((y-1980)/4));
  fx(1,1,"元日");fx(1,nthMon(1,2),"成人の日");fx(2,11,"建国記念の日");if(y>=2020)fx(2,23,"天皇誕生日");
  fx(3,eq(20.8431),"春分の日");fx(4,29,"昭和の日");fx(5,3,"憲法記念日");fx(5,4,"みどりの日");fx(5,5,"こどもの日");
  fx(7,nthMon(7,3),"海の日");if(y>=2016)fx(8,11,"山の日");fx(9,nthMon(9,3),"敬老の日");fx(9,eq(23.2488),"秋分の日");
  fx(10,nthMon(10,2),"スポーツの日");fx(11,3,"文化の日");fx(11,23,"勤労感謝の日");
  Object.keys(m).sort().forEach(d=>{ // 日曜が祝日なら、次の平日が振替休日
    if(wk(d)===0){let t=addDays(d,1);while(m[t])t=addDays(t,1);m[t]="振替休日"}
  });
  for(let n=dn(key(1,1));n<=dn(key(12,31));n++){ // 祝日にはさまれた平日は国民の休日
    const d=fromDn(n);
    if(!m[d]&&wk(d)!==0&&m[addDays(d,-1)]&&m[addDays(d,1)])m[d]="国民の休日";
  }
  return HOL_CACHE[y]=m;
}
const holidayName=d=>holidaysOf(+d.slice(0,4))[d]||"";
const calHol=d=>isWeekend(d)||!!holidayName(d);
const calReason=d=>holidayName(d)?`祝日（${holidayName(d)}）`:isWeekend(d)?`${wd(d)}曜日`:"平日";
const isWeekend=d=>{const w=new Date(dn(d)*86400000).getUTCDay();return w===0||w===6};

/* ---------- 状態 ---------- */
let S={ver:4,factors:DEF(),entries:{}};
let tab="input",mode="sc",date=today(),draft=null,delArm=null;
let cal={y:new Date().getFullYear(),m:new Date().getMonth(),metric:"total"};
let gr={days:30,show:{total:1,am:1,noon:1,pm:1},sel:null,split:true};
let an={t:"total"},aiInc={};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const clamp=x=>Math.max(0,Math.min(100,Math.round(+x||0)));
const isNum=v=>typeof v==="number"&&isFinite(v);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast("保存に失敗しました");return false}}
const hasF=id=>S.factors.some(f=>f.id===id);
const splitList=s=>String(s).split(/[,、，\n]/).map(x=>x.trim()).filter(Boolean);
const kwHit=(note,kw)=>!!note&&(kw||[]).some(w=>w&&note.includes(w));
const noteAll=e=>((e.noteF||"")+"\n"+(e.noteS||"")).trim();
function parseSteps(t){const m=String(t).replace(/,/g,"").match(/\d+(\.\d+)?/);return m?Math.round(parseFloat(m[0])):null}
function absH(t,rh){return Math.round(216.7*(rh/100*6.112*Math.exp(17.62*t/(243.12+t)))/(273.15+t)*10)/10}

/* ---------- データの形を揃える（旧版の記録も引き継ぐ） ---------- */
function migrate(){
  if(!S||typeof S!=="object")S={};
  if(!Array.isArray(S.factors))S.factors=DEF();
  if(!S.entries||typeof S.entries!=="object")S.entries={};
  if((S.ver||0)<3&&!S.factors.some(f=>f.id==="season")){
    const i=S.factors.findIndex(f=>f.id==="ah");
    S.factors.splice(i>=0?i+1:S.factors.length,0,SEASON());
  }
  if((S.ver||0)<4){
    Object.keys(S.entries).forEach(d=>{const e=S.entries[d];
      if(isNum(e.score)){e.legacy=e.score;delete e.score}   // 旧「睡眠スコア」は参考として残す
      if(e.note!==undefined){e.noteF=e.note;delete e.note}
    });
  }
  S.factors.forEach(f=>{delete f.ideal});
  // 新しい標準の要因を、一度だけ追加する（あとで削除しても、もう一度は追加しない）
  if(!Array.isArray(S.seeded))S.seeded=[];
  [[{id:"weekday",name:"曜日",type:"choice",opts:["月","火","水","木","金","土","日"],auto:"weekday"},"season"],[{id:"alcQty",name:"飲酒量",type:"num",unit:"杯"},"alcohol"],[{id:"caffeine",name:"カフェイン",type:"num",unit:"杯"},"alcQty"],[{id:"ac",name:"エアコン使用",type:"bool"},"ah"],[{id:"bed",name:"就寝時刻",type:"num",time:true,auto:"sleep"},"ac"],[{id:"wake",name:"起床時刻",type:"num",time:true,auto:"sleep"},"bed"],[{id:"sleepDur",name:"睡眠時間",type:"num",unit:"時間",auto:"sleep",computed:true},"wake"]].forEach(([def,after])=>{
    if(S.seeded.includes(def.id))return;
    S.seeded.push(def.id);
    if(S.factors.some(f=>f.id===def.id))return;
    const i=S.factors.findIndex(f=>f.id===after);
    S.factors.splice(i>=0?i+1:S.factors.length,0,def);
  });
  S.ver=4;
  Object.keys(S.entries).forEach(d=>{const e=S.entries[d];if(!e.v)e.v={};if(!e.sc)e.sc={}});
}
/* ---------- スコア ---------- */
const totalOf=sc=>{const a=SLOTS.map(s=>sc&&sc[s.k]).filter(isNum);return a.length?Math.round(mean(a)):undefined};
const scoreOf=(e,k)=>k==="total"?totalOf(e.sc):(e.sc&&isNum(e.sc[k])?e.sc[k]:undefined);
const hasScore=e=>totalOf(e.sc)!==undefined;
const hasFac=e=>Object.keys(e.v||{}).length>0||!!e.noteF;
const isEmptyEntry=e=>!hasFac(e)&&!hasSleep(e)&&!hasScore(e)&&!e.noteS&&!isNum(e.legacy);
const scLabel=v=>v===undefined?"未入力":`${level(v).e} ${v}点`;
function ent(d){return S.entries[d]||(S.entries[d]={v:{},sc:{},noteF:"",noteS:""})}
function prune(d){const e=S.entries[d];if(e&&isEmptyEntry(e))delete S.entries[d]}
let touched=false;
const defDate=()=>mode==="fac"?addDays(today(),1):today();
function entryDraft(){
  const e=S.entries[date];
  draft={v:{...(e&&e.v)},sc:{...(e&&e.sc)},sl:{...(e&&e.sl)},noteF:(e&&e.noteF)||"",noteS:(e&&e.noteS)||""};
  if(hasF("holiday")&&draft.v.holiday===undefined)draft.v.holiday=calHol(date)?1:0;
  if(hasF("season")&&draft.v.season===undefined)draft.v.season=seasonOf(date);
}
// 要因の値を取り出す（季節・キーワードは日付や備考から自動で決まる）
// ---- 就寝・起床の時刻（スコア入力画面で入力。分析では数値にして使う）----
const hm=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?(+m[1])+(+m[2])/60:null};
const bedH=t=>{const h=hm(t);return h===null?null:(h<12?h+24:h)};   // 午前0〜11時の就寝は「25:00」のように24時間以降として扱う
function sleepVal(f,e){
  const sl=e.sl||{};
  if(f.id==="bed")return bedH(sl.bed);
  if(f.id==="wake")return hm(sl.wake);
  if(f.id==="sleepDur"){const b=bedH(sl.bed),w=hm(sl.wake);if(b===null||w===null)return null;const d=Math.round((w+24-b)*60)/60;return d>0&&d<=18?d:null}
  return null;
}
const clockJ=h=>{const t=Math.round(h*60),hh=Math.floor(t/60),mm=t%60;return (hh>=24?"翌"+(hh-24):hh)+":"+String(mm).padStart(2,"0")};
const hasSleep=e=>!!(e.sl&&(e.sl.bed||e.sl.wake));
function getVal(f,e,d){
  if(f.auto==="kw")return kwHit(noteAll(e),f.kw)?1:0;
  if(f.auto==="season")return e.v.season!==undefined?e.v.season:seasonOf(d);
  if(f.auto==="weekday")return wd(d);   // 体調を感じた日（スコアの日）の曜日
  if(f.auto==="sleep"){const v=sleepVal(f,e);return v===null?undefined:v}
  if(f.id==="holiday"&&e.v.holiday===undefined)return calHol(d)?1:0;   // 入力がない日は、カレンダー通り
  return e.v[f.id];
}

/* ---------- グラフ ---------- */
const GW=360,PL=30,PR=12,PT=12,PB=28,GI=11;   // GI＝左右の余白（端の印が軸の数字に重ならないように）
const gx=(g,d)=>PL+GI+(GW-PL-PR-2*GI)*(dn(d)-dn(g.start))/Math.max(1,dn(g.end)-dn(g.start));
function mkShape(shape,x,y,cls,extra){
  x=+x;y=+y;
  return `<circle class="mk ${cls}"${extra||""} cx="${x}" cy="${y}" r="4"/>`;
}
// 朝・昼・夕・総合は、色つきの丸に文字（朝／昼／夕／総）を入れた印にする。日数が多いときは文字なしの小さな丸にする
function mkMark(s,x,y,tier){
  x=+x;y=+y;
  if(tier>=2)return `<circle class="mk ${s.c}" cx="${x}" cy="${y}" r="9"/><text class="lt${s.c==="c4"?" dk":""}" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${s.t}</text>`;
  return `<circle class="mk ${s.c}" cx="${x}" cy="${y}" r="${tier===1?5:6}"/>`;
}
const gTier=g=>{const sp=(GW-PL-PR-2*GI)/Math.max(1,dn(g.end)-dn(g.start));return sp>=20?2:sp>=9?1:0};
// 「重ねる」は1枚に全部、「分ける」は総合・朝・昼・夕を別々の小さなグラフにして縦に並べる
function graphLayout(){
  const vis=SERIES.filter(s=>gr.show[s.k]);
  if(!gr.split||vis.length<2)return {split:false,panels:[{series:vis,top:PT,h:190}],H:PT+190+PB};
  let y=PT;
  const panels=vis.map(s=>{const h=s.k==="total"?104:76,p={series:[s],top:y+18,h};y+=18+h+8;return p});
  return {split:true,panels,H:y-8+PB};
}
function graphData(){
  const all=Object.keys(S.entries).filter(d=>hasScore(S.entries[d])).sort();
  if(!all.length)return null;
  const last=all[all.length-1],end=today()>last?today():last;
  const start=gr.days===0?all[0]:addDays(end,-(gr.days-1));
  const ds=all.filter(d=>d>=start&&d<=end);
  return {all,ds,start:gr.days===0?all[0]:start,end};
}
function graphSvg(g){
  const {ds,start,end}=g,s0=dn(start),span=Math.max(1,dn(end)-s0),pw=GW-PL-PR,lay=g.lay=graphLayout(),H=lay.H;
  const X=d=>gx(g,d);
  let o=`<svg class="gsvg" id="gsvg" viewBox="0 0 ${GW} ${H}" role="img" aria-label="体調スコアの推移の折れ線グラフ。${md(start)}から${md(end)}。詳しい値は下の表で確認できます。">`;
  const tier=gTier(g),lastP=lay.panels[lay.panels.length-1];
  lay.panels.forEach(pn=>{
    const Y=v=>pn.top+pn.h*(1-v/100),steps=lay.split?[0,50,100]:[0,20,40,60,80,100];
    if(lay.split){const s=pn.series[0];o+=`<circle class="mk ${s.c}" cx="${PL+8}" cy="${pn.top-9}" r="7"/><text class="lt${s.c==="c4"?" dk":""}" x="${PL+8}" y="${pn.top-9}" text-anchor="middle" dominant-baseline="central">${s.t}</text><text x="${PL+20}" y="${pn.top-9}" dominant-baseline="central" style="fill:var(--ink);font-weight:600">${s.n}</text>`}
    steps.forEach(v=>{o+=`<line class="${v===0?"ax":"gl"}" x1="${PL}" x2="${GW-PR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${PL-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`});
  });
  const nt=Math.min(5,span+1);
  for(let i=0;i<nt;i++){const n=Math.round(s0+span*(nt===1?0:i/(nt-1))),d=fromDn(n);o+=`<text x="${X(d)}" y="${H-9}" text-anchor="${i===0?"start":i===nt-1?"end":"middle"}">${md(d)}</text>`}
  const sx=gr.sel&&ds.includes(gr.sel)?X(gr.sel):-10;
  o+=`<line class="cx" id="gcx" x1="${sx}" x2="${sx}" y1="${PT}" y2="${lastP.top+lastP.h}"/>`;
  lay.panels.forEach(pn=>{
    const Y=v=>pn.top+pn.h*(1-v/100);
    pn.series.forEach(s=>{
      const pts=ds.map(d=>{const v=scoreOf(S.entries[d],s.k);return v===undefined?null:{d,v,x:X(d),y:Y(v)}}).filter(Boolean);
      let path="",prev=null;
      pts.forEach(p=>{path+=(prev&&dn(p.d)-dn(prev.d)<=7?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)+" ";prev=p});
      if(pts.length>1)o+=`<path class="ln ${s.c}" d="${path}"/>`;
      pts.forEach(p=>{if(tier>0||p===pts[pts.length-1])o+=mkMark(s,p.x.toFixed(1),p.y.toFixed(1),tier)});

      for(const s of seg.segment(txt)){if(s.isWordLike){const w=s.segment.toLowerCase();if(okWord(w))set.add(w)}}
      rows.push({set,y})}});
  const cnt={};rows.forEach(r=>r.set.forEach(w=>{cnt[w]=(cnt[w]||0)+1}));
  const grp={};
  Object.keys(cnt).forEach(w=>{
    const a=rows.filter(r=>r.set.has(w)).map(r=>r.y),b=rows.filter(r=>!r.set.has(w)).map(r=>r.y);
    if(a.length<3||b.length<3)return;
    const key=rows.map(r=>r.set.has(w)?1:0).join(""); // 同じ日に出る言葉は、1つにまとめる
    if(grp[key])grp[key].ws.push(w);
    else grp[key]={ws:[w],na:a.length,ma:mean(a),mb:mean(b),d:mean(a)-mean(b)};
  });
  const out=Object.values(grp).map(g=>({w:g.ws.slice(0,3).join("・"),na:g.na,ma:g.ma,mb:g.mb,d:g.d}));
  out.sort((p,q)=>Math.abs(q.d)-Math.abs(p.d));
  return {N:rows.length,list:out.slice(0,8)};
}
function viewAnalysis(){
  const n=Object.keys(S.entries).filter(d=>hasScore(S.entries[d])).length;
  if(n<3)return `<div class="card">分析には、スコアが入った日が3日分以上必要です（現在${n}日）。記録が増えるほど信頼できる結果になります。</div>`;
  const sum=buildSummary();
  let h=`<div class="card"><b>総評（自動）</b><div class="sumtxt" style="margin-top:8px">${sum.map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("")}</div>
  <button class="btn" id="aicp">AIに相談する文章をコピー</button>
  <div class="small" style="margin-top:6px">コピーした文章を、ClaudeなどのAIアプリに貼り付けると、より詳しいコメントがもらえます。このアプリの中では、AIに自動で送信していません。</div>
  <details><summary>相談文に含める要因を選ぶ</summary><div class="small" style="margin-top:6px">チェックを外した要因は、相談文に含めません。備考の文章は、そのまま含まれます。</div>
  ${S.factors.map(f=>`<label class="ck"><input type="checkbox" data-ai="${f.id}"${aiInc[f.id]===false?"":" checked"}>${esc(f.name)}</label>`).join("")}</details>
  <div class="small" id="aimsg"></div></div>`;
  h+=`<div class="card"><b>時間帯ごとの主な要因</b><div class="small" style="margin-top:4px">良くする要因と悪くする要因を、1つずつ表示します（平均点の差が約${MINDIFF}点以上のものだけ）。</div>`;
  TARGETS.forEach(t=>{const e=effects(t.k),c=e.N;
    const g=e.good[0],b=e.bad[0];
    h+=`<div class="hd" style="margin-top:8px"><b>${t.n}</b><span class="small">${c}日分</span></div><div class="small">${g||b?[g?"👍 "+esc(short(g)):"",b?"👎 "+esc(short(b)):""].filter(Boolean).join("<br>"):(c<5?"データ不足":"はっきりした要因なし")}</div>`});
  h+=`</div><div class="chips" role="group" aria-label="くわしく見る点数">${TARGETS.map(t=>`<button class="chip${an.t===t.k?" on":""}" data-at="${t.k}">${t.n}を詳しく</button>`).join("")}</div>`;
  const label=TARGETS.find(x=>x.k===an.t).n,E=effects(an.t);
  h+=`<div class="card"><div class="hd"><b>${label}スコアの平均</b><span>${E.N?(mean(Object.keys(S.entries).map(d=>scoreOf(S.entries[d],an.t)).filter(v=>v!==undefined))).toFixed(1)+"点":"–"}</span></div><div class="small">${E.N}日分（前日の状態 → 次の日の体調）</div></div>`;
  const card=(c,i,sign)=>`<div class="rk"><div class="n">${i+1}</div><div style="flex:1"><div class="hd"><b>${esc(c.f.name)}</b><span class="pt ${sign}">${c.diff>0?"+":"-"}${Math.abs(c.diff).toFixed(1)}点${c.weak?`<span class="rel">参考程度</span>`:""}</span></div>
    <div class="cond">${esc(c.cond)}：平均 ${c.ma.toFixed(1)}点（${c.na}日）<br><span class="small">${esc(c.rest)}：${c.mb.toFixed(1)}点（${c.nb}日）</span></div>${c.levels?`<div class="small" style="margin-top:4px">${esc(c.levels)}</div>`:""}</div></div>`;
  h+=`<div class="card"><h3>👍 ${label}スコアを良くする要因</h3><div class="small">効きが大きい順です。</div>${E.good.length?E.good.map((c,i)=>card(c,i,"pos")).join(""):`<div class="small" style="margin-top:8px">まだ見つかっていません。</div>`}</div>`;
  h+=`<div class="card"><h3>👎 ${label}スコアを悪くする要因</h3><div class="small">効きが大きい順です。</div>${E.bad.length?E.bad.map((c,i)=>card(c,i,"neg")).join(""):`<div class="small" style="margin-top:8px">まだ見つかっていません。</div>`}</div>`;
  const AV=actualValues(an.t);
  if(AV.length)h+=`<div class="card"><h3>🔎 良い日と悪い日の実際の値</h3><div class="small">${label}スコアが高かった日（上位3分の1）と低かった日（下位3分の1）で、各要因の平均を比べます。値の違いが大きい順です。</div>`+
    AV.map(a=>`<div class="rk"><div style="flex:1"><div class="hd"><b>${esc(a.f.name)}</b>${a.weak?`<span class="rel">参考程度</span>`:""}</div>
      <div class="cond">👍 良かった日：<b>${esc(fmtVal(a.f,a.mt))}</b> <span class="small">（平均${a.mtY.toFixed(0)}点・${a.n}日）</span><br>👎 悪かった日：<b>${esc(fmtVal(a.f,a.mb))}</b> <span class="small">（平均${a.mbY.toFixed(0)}点・${a.n}日）</span></div></div></div>`).join("")+`</div>`;
  // 曜日ごとの平均点
  if(S.factors.some(f=>f.auto==="weekday")){
    const g={};Object.keys(S.entries).forEach(d=>{const y=scoreOf(S.entries[d],an.t);if(y!==undefined)(g[wd(d)]=g[wd(d)]||[]).push(y)});
    const days=["月","火","水","木","金","土","日"].filter(w=>g[w]);
    if(days.length){
      const gw=E.good.find(c=>c.f.auto==="weekday"),bw=E.bad.find(c=>c.f.auto==="weekday");
      h+=`<div class="card"><h3>📅 曜日ごとの平均点</h3><div class="small">体調を感じた日の曜日です（祝日は、その曜日のまま数えます）。休日かどうかは、「休日」の要因で別に分析します。</div><div style="margin-top:8px">`+
        days.map(w=>`<div class="band ${gw&&gw.wday===w?"best":bw&&bw.wday===w?"bad":""}" style="grid-template-columns:40px 1fr 44px"><span>${w}曜</span><div class="b" style="width:${Math.max(2,Math.round(mean(g[w])))}%"></div><span>${mean(g[w]).toFixed(0)}点<br><span class="small">${g[w].length}日</span></span></div>`).join("")+
        `</div><div class="small" style="margin-top:6px">${gw?`<b>高めの曜日：${esc(gw.cond)}</b>（平均${gw.ma.toFixed(0)}点${gw.weak?"・参考程度":""}）`:"高めの曜日は、まだ判断できません（曜日ごとに3日以上の記録が必要です）。"}${bw?`　低めの曜日：${esc(bw.cond)}（平均${bw.ma.toFixed(0)}点${bw.weak?"・参考程度":""}）`:""}</div></div>`;
    }
  }
  // 帯ごとの平均点（室温・室内湿度）
  S.factors.filter(f=>f.id==="tempIn"||f.id==="rhIn"||f.id==="sleepDur").forEach(f=>{
    const bs=bandStats(an.t,f);if(!bs.length)return;
    const gz=E.good.find(c=>c.f.id===f.id&&c.zlo!==undefined),bz=E.bad.find(c=>c.f.id===f.id&&c.zlo!==undefined),u=f.unit||"";
    const inZ=(b,c)=>!!c&&c.zlo!==undefined&&b.lo>=c.zlo-1e-9&&b.hi<=c.zhi+1e-9;
    h+=`<div class="card"><h3>${f.id==="tempIn"?"🌡":f.id==="rhIn"?"💧":"😴"} ${esc(f.name)}の帯ごとの平均点</h3><div class="small">あなたにとって快適な${f.id==="tempIn"?"温度":f.id==="rhIn"?"湿度":"睡眠時間"}を探します。</div><div style="margin-top:8px">`+
      bs.map(b=>`<div class="band ${inZ(b,gz)?"best":inZ(b,bz)?"bad":""}"><span>${f.id==="sleepDur"?durText(b.lo)+"〜"+durText(b.hi):b.lo+"〜"+b.hi+u}</span><div class="b" style="width:${Math.max(2,Math.round(b.m))}%"></div><span>${b.m.toFixed(0)}点<br><span class="small">${b.n}日</span></span></div>`).join("")+
      `</div><div class="small" style="margin-top:6px">${gz?`<b>快適帯の目安：${esc(gz.cond.replace(/の日$/,""))}</b>（平均${gz.ma.toFixed(0)}点${gz.weak?"・参考程度":""}）`:"快適帯は、まだ判断できません（帯ごとに3日以上の記録が必要です）。"}${bz?`　良くない帯：${esc(bz.cond.replace(/の日$/,""))}`:""}</div></div>`;
  });
  if(E.skip.length)h+=`<div class="card"><details><summary>スコアとの関係が小さい／判断できない要因（${E.skip.length}個）</summary><div class="small" style="margin-top:8px">${E.skip.map(x=>`${esc(x.f.name)}（${esc(x.why)}）`).join("<br>")}</div></details></div>`;
  h+=viewWords(an.t);
  return h+`<div class="small">要因ごとに「ある条件の日」と「それ以外の日」の平均点を比べています。条件の境目（歩数の○歩以上など）は、記録からいちばん差が大きくなる所を自動で探しているため、日数が少ないうちは偶然に左右されます。「参考程度」は、日数が少ない、または差が偶然かもしれない結果です。目安は、条件ごとに5日以上、全体で14日以上です。関係が見られただけで、原因とは限りません。</div>`;
}
function bindAnalysis(){
  document.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{an.t=b.dataset.at;render()});
  document.querySelectorAll("[data-ai]").forEach(c=>c.onchange=()=>{aiInc[c.dataset.ai]=c.checked});
  const cp=$("#aicp");
  if(cp)cp.onclick=async()=>{
    const txt=aiPrompt();
    try{await navigator.clipboard.writeText(txt);toast("コピーしました。AIアプリに貼り付けてください");$("#aimsg").textContent=`${txt.length}文字をコピーしました。`}
    catch(e){$("#aimsg").innerHTML="コピーできませんでした。下の内容を全選択してコピーしてください。<textarea readonly>"+esc(txt)+"</textarea>"}
  };
}

/* ---------- 履歴・要因設定・設定 ---------- */
function viewHistory(){
  const ks=Object.keys(S.entries).sort().reverse();
  if(!ks.length)return `<div class="card">まだ記録がありません。「入力」から最初の1日を保存しましょう。</div>`;
  return ks.map(k=>{const e=S.entries[k],t=totalOf(e.sc);
    const sc=SLOTS.map(s=>`${s.n} ${scoreOf(e,s.k)??"–"}`).join("　");
    const parts=partsOf(e,k);
    return `<div class="card"><div class="hd"><b>${k}（${wd(k)}）</b><span>${t!==undefined?level(t).e+" <b style=\"font-size:20px\">"+t+"</b>点":"<span class=\"small\">スコア未入力</span>"}</span></div>
    ${t!==undefined?`<div class="small">${sc}</div>`:""}
    ${isNum(e.legacy)?`<div class="small">旧「睡眠スコア」：${e.legacy}点（旧形式の記録）</div>`:""}
    ${parts?`<div class="small" style="margin-top:4px">前日の要因：${parts}</div>`:""}
    ${hasSleep(e)?`<div class="small" style="margin-top:4px">睡眠：就寝 ${esc((e.sl||{}).bed||"–")}／起床 ${esc((e.sl||{}).wake||"–")}（${esc(sdurText(e.sl).replace("睡眠時間 –","–").replace("睡眠 ",""))}）</div>`:""}${e.noteF?`<div class="note">📝 前日の備考：${esc(e.noteF)}</div>`:""}${e.noteS?`<div class="note">📝 その日の備考：${esc(e.noteS)}</div>`:""}
    <div class="row" style="margin-top:8px"><button class="sm" data-editf="${k}">要因を編集</button><button class="sm" data-edits="${k}">スコアを編集</button><button class="sm" data-del="${k}">${delArm===k?"本当に削除":"この日を削除"}</button></div></div>`}).join("");
}
function factorDesc(f){
  if(f.auto==="sleep")return f.computed?"就寝と起床から自動計算":"時刻（スコア入力画面で入力）";
  if(f.auto==="kw")return "備考のキーワード："+esc((f.kw||[]).join("、"));
  if(f.auto==="season")return "選択式・日付から自動";
  if(f.auto==="weekday")return "日付から自動（月〜日）";
  if(f.type==="choice")return "選択式："+esc((f.opts||[]).join("／"));
  if(f.type==="bool")return "あり／なし";
  return "数値"+(f.unit?"（"+esc(f.unit)+"）":"")+(f.computed?" ・自動計算":"");
}
function viewFactors(){
  let h=`<div class="card"><b>新しい要因を追加</b><label for="nn">名前</label><input id="nn" placeholder="例：カフェイン、運動、仕事のストレス">
  <label for="nt">種類</label><select id="nt"><option value="bool">あり／なし</option><option value="num">数値</option><option value="choice">選択式（いくつかから選ぶ）</option><option value="kw">備考のキーワード（自動判定）</option></select>
  <div id="x_num" hidden><label for="nu">単位（任意）</label><input id="nu" placeholder="例：杯、分"></div>
  <div id="x_choice" hidden><label for="no">選択肢（カンマ区切り、2つ以上）</label><input id="no" placeholder="例：低い,ふつう,高い"></div>
  <div id="x_kw" hidden><label for="nk">キーワード（カンマ区切り）</label><input id="nk" placeholder="例：嫌,ムカ,怒,ストレス">
  <div class="small" style="margin-top:4px">備考にこの言葉が含まれる日を「あり」、含まれない日を「なし」として、自動で分析します。備考を書かなかった日は「なし」になります。</div></div>
  <button class="btn" id="add">追加</button></div>`;
  S.factors.forEach((f,i)=>{
    h+=`<div class="card" id="fc_${f.id}"><div class="hd"><span><b>${esc(f.name)}</b> <span class="small">${factorDesc(f)}</span></span>
  <span class="row" style="gap:6px"><button class="sm" data-up="${f.id}" aria-label="${esc(f.name)}を上へ"${i===0?" disabled":""}>▲</button><button class="sm" data-dn="${f.id}" aria-label="${esc(f.name)}を下へ"${i===S.factors.length-1?" disabled":""}>▼</button><button class="sm" data-rm="${f.id}">${delArm===f.id?"本当に削除":"削除"}</button></span></div>`;
    h+=`</div>`;
  });
  return h+`<div class="small">▲▼で並べ替えると、入力画面の要因の順番も変わります。要因を削除しても、過去の記録の値は残ります。追加した要因は、過去の日には値が入っていない扱いになります（備考のキーワードは、過去の備考にも自動で当てはまります）。名前や中身を変えたい場合は、削除して追加し直してください。</div>`;
}
function viewData(){
  const nd=Object.keys(S.entries).length;
  return `<div class="card"><b>バックアップ</b>
  <div class="small" style="margin-top:4px">記録はこのiPhoneの中だけに保存されています。機種変更やアプリの削除に備えて、ときどき書き出してください。</div>
  <button class="btn" id="exp">記録をコピーして書き出す</button>
  <div class="small" id="expmsg" style="margin-top:6px"></div></div>
  <div class="card"><b>読み込み</b>
  <div class="small" style="margin-top:4px">書き出した内容を貼り付けて読み込みます。いまの記録は、読み込んだ内容で置き換わります。</div>
  <label for="imp">書き出した内容</label><textarea id="imp" placeholder="ここに貼り付け"></textarea>
  <button class="btn alt" id="impb">読み込む</button></div>
  <div class="small">登録日数：${nd}日／要因：${S.factors.length}個</div>`;
}
function bindOthers(){
  document.querySelectorAll("[data-editf]").forEach(b=>b.onclick=()=>{date=b.dataset.editf;touched=true;mode="fac";delArm=null;entryDraft();tab="input";render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-edits]").forEach(b=>b.onclick=()=>{date=b.dataset.edits;touched=true;mode="sc";delArm=null;entryDraft();tab="input";render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(delArm===b.dataset.del){delete S.entries[delArm];delArm=null;persist();render()}else{delArm=b.dataset.del;render()}});
  const mv=(id,dir)=>{const i=S.factors.findIndex(f=>f.id===id),j=i+dir;if(i<0||j<0||j>=S.factors.length)return;
    [S.factors[i],S.factors[j]]=[S.factors[j],S.factors[i]];delArm=null;persist();render();
    const c=document.getElementById("fc_"+id);if(c&&c.scrollIntoView)c.scrollIntoView({block:"center"})};
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>mv(b.dataset.up,-1));
  document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>mv(b.dataset.dn,1));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    if(delArm===b.dataset.rm){S.factors=S.factors.filter(f=>f.id!==delArm);delArm=null;persist();render()}else{delArm=b.dataset.rm;render()}});
  const nt=$("#nt");
  if(nt){const show=()=>{["num","choice","kw"].forEach(k=>{$("#x_"+k).hidden=nt.value!==k})};nt.onchange=show;show()}
  const add=$("#add");
  if(add)add.onclick=()=>{
    const name=$("#nn").value.trim(),type=$("#nt").value;
    if(!name){toast("名前を入力してください");return}
    const f={id:"c"+Date.now().toString(36),name,type};
    if(type==="num")f.unit=$("#nu").value.trim();
    if(type==="choice"){f.opts=[...new Set(splitList($("#no").value))];if(f.opts.length<2){toast("選択肢を2つ以上入力してください");return}}
    if(type==="kw"){f.type="bool";f.auto="kw";f.kw=splitList($("#nk").value);if(!f.kw.length){toast("キーワードを入力してください");return}}
    S.factors.push(f);persist();toast("追加しました");render();
  };
  const ex=$("#exp");
  if(ex)ex.onclick=async()=>{
    const txt=JSON.stringify(S);
    try{await navigator.clipboard.writeText(txt);toast("コピーしました。メモアプリなどに貼り付けて保管してください")}
    catch(e){$("#expmsg").innerHTML="コピーできませんでした。下の内容を全選択してコピーしてください。<textarea readonly>"+esc(txt)+"</textarea>"}
  };
  const ib=$("#impb");
  if(ib)ib.onclick=()=>{
    try{
      const o=JSON.parse($("#imp").value);
      if(!o||typeof o!=="object"||!Array.isArray(o.factors)||!o.entries||typeof o.entries!=="object")throw 0;
      S=o;migrate();persist();entryDraft();toast("読み込みました");render();
    }catch(e){toast("読み込めませんでした。内容を確認してください")}
  };
}
function render(){
  renderNav();
  const v=$("#view");
  if(tab==="input"){if(!draft)entryDraft();v.innerHTML=viewInput();bindInput()}
  else if(tab==="calendar"){v.innerHTML=viewCalendar();bindCalendar()}
  else if(tab==="graph"){v.innerHTML=viewGraph();if($("#gbox"))bindGraph()}
  else if(tab==="analysis"){v.innerHTML=viewAnalysis();bindAnalysis()}
  else{v.innerHTML=tab==="history"?viewHistory():tab==="factors"?viewFactors():viewData();bindOthers()}
}
/* ---------- boot ---------- */
(function(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.factors)&&o.entries)S=o}}catch(e){}
  const before=S.ver;migrate();if(before!==S.ver)persist();
  try{const m=localStorage.getItem(MODEKEY);if(m==="fac"||m==="sc")mode=m}catch(e){}
  date=defDate();entryDraft();
  $("#st").textContent="この端末に保存中";
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
